<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión - Tienda Familiar</title>
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
    <header>
        <nav>
            <ul id="nav-list">
                <li><a href="../index.html" class="nav-link">Inicio</a></li>
                <li><a href="catalogo.html" class="nav-link">Catálogo Ropa</a></li>
                <li><a href="contacto.html" class="nav-link">Contacto</a></li>
                <li><a href="inicio-sesion.html" class="nav-link">Iniciar sesión</a></li>
                <li><a href="pages/inicio-sesion.html" class="nav-link">Iniciar sesión</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section id="login">
            <div class="marca">
                <img src="../img/banner-tienda.svg" alt="Logo de Tienda Familiar">
                <h1>Tienda Familiar</h1>
            </div>

            <form id="form-login" novalidate>
                <h2>Inicio de sesión</h2>

                <div class="campo-form">
                    <label for="correo">Correo:</label>
                    <input type="email" id="correo" name="correo" maxlength="100"
                           autocomplete="email" placeholder="tucorreo@duoc.cl">
                    <span class="mensaje-error" id="error-correo"></span>
                </div>

                <div class="campo-form">
                    <label for="password">Contraseña:</label>
                    <input type="password" id="password" name="password" maxlength="10"
                           autocomplete="current-password">
                    <span class="mensaje-error" id="error-password"></span>
                </div>

                <button type="submit">Iniciar sesión</button>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Tienda Familiar - Ropa y Accesorios</p>
    </footer>

    <script src="../js/inicio-sesion.js"></script>
</body>
</html>
