<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto - Tienda de Ropa</title>
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
    <header>
        <nav>
            <ul id="nav-list">
                <li><a href="../index.html" class="nav-link">Inicio</a></li>
                <li><a href="#" class="nav-link">Catálogo</a></li>
                <li><a href="contacto.html" class="nav-link">Contacto</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section id="contacto">
            <h1>Contáctanos</h1>
            <form id="form-contacto" novalidate>
                <div class="campo-form">
                    <label for="nombre">Nombre completo:</label>
                    <input type="text" id="nombre" name="nombre" maxlength="100">
                    <span class="mensaje-error" id="error-nombre"></span>
                </div>

                <div class="campo-form">
                    <label for="correo">Correo:</label>
                    <input type="email" id="correo" name="correo" maxlength="100">
                    <span class="mensaje-error" id="error-correo"></span>
                </div>

                <div class="campo-form">
                    <label for="mensaje">Mensaje:</label>
                    <textarea id="mensaje" name="mensaje" maxlength="500"></textarea>
                    <span class="mensaje-error" id="error-mensaje"></span>
                </div>

                <button type="submit">Enviar mensaje</button>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Tienda de Ropa</p>
    </footer>

    <script src="../js/contacto.js"></script>
</body>
</html>
