<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo - Tienda de Ropa</title>
    <link rel="stylesheet" href="../css/styles.css">
</head>

<body>
    <header>
        <nav>
            <ul id="nav-list">
                <li><a href="../index.html" class="nav-link">Inicio</a></li>
                <li><a href="catalogo.html" class="nav-link">Catálogo Ropa</a></li>
                <li><a href="contacto.html" class="nav-link">Contacto</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <section id="catalogo">
            <h1>Nuestro Catálogo</h1>
            <p>Explora nuestra selección de prendas y accesorios</p>
            <div class="grilla-productos">
                <article class="producto">
                    <img src="../img/polerasimple.jpg" alt="Polera básica de algodón">
                    <h2>Polera Básica</h2>
                    <p class="precio">$12.990</p>
                    <button class="btn-agregar">Añadir al carrito</button>
                </article>

                <article class="producto">
                    <img src="../img/jeans.jpg" alt="Jeans corte recto">
                    <h2>Jeans Corte Recto</h2>
                    <p class="precio">$29.990</p>
                    <button class="btn-agregar">Añadir al carrito</button>
                </article>

                <article class="producto">
                    <img src="../img/chaquetamezclilla.jpg" alt="Chaqueta de mezclilla">
                    <h2>Chaqueta Mezclilla</h2>
                    <p class="precio">$39.990</p>
                    <button class="btn-agregar">Añadir al carrito</button>
                </article>

                <article class="producto">
                    <img src="../img/zapatillas.jpg" alt="Zapatillas urbanas blancas">
                    <h2>Zapatillas Urbanas</h2>
                    <p class="precio">$34.990</p>
                    <button class="btn-agregar">Añadir al carrito</button>
                </article>

                <article class="producto">
                    <img src="../img/bolsocuero.jpg" alt="Bolso de cuero sintético">
                    <h2>Bolso de Cuero</h2>
                    <p class="precio">$24.990</p>
                    <button class="btn-agregar">Añadir al carrito</button>
                </article>

                <article class="producto">
                    <img src="../img/gorrolana.jpg" alt="Gorro de lana tejido">
                    <h2>Gorro de Lana</h2>
                    <p class="precio">$8.990</p>
                    <button class="btn-agregar">Añadir al carrito</button>
                </article>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Tienda de Ropa</p>
    </footer>
    <script src="../js/catalogo.js"></script>
</body>

</html>
